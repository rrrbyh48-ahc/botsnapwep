<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Automation Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 12px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 1.05rem;
            font-weight: 600;
        }
        .controls-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-action {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn-snap {
            background-color: #fffc00;
            color: #000;
        }
        .btn-green {
            background-color: #16a34a;
        }
        .section-title {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        .console-screen {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 8px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.7rem;
            color: #38bdf8;
        }
        .console-line {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Snap Automation Dashboard</h1>
    </div>

    <div class="controls-box">
        <!-- زر يوجه مباشرة لنسخة الويب الكاملة مع باراميترات فرض الديسك톱 -->
        <a href="https://web.snapchat.com/" target="_blank" class="btn-action btn-snap" onclick="forceDesktopMode()">فتح سناب شات (Desktop)</a>
        <button class="btn-action btn-green" onclick="runTask('تشغيل مهام الأتمتة')">تشغيل المهام</button>
    </div>

    <h2 class="section-title">Live Log Console</h2>
    <div class="console-screen" id="consoleLog">
        <div class="console-line">[System] Ready. Click the yellow button to open Desktop Web.</div>
    </div>

    <script>
        function forceDesktopMode() {
            logMessage("[Desktop Mode] Forcing desktop user-agent parameters...");
            // ملاحظة: إذا كان التطبيق الخاص بك يدعم التحكم بـ WebView، تأكد من تفعيل setJavaScriptEnabled و setLoadWithOverviewMode
        }

        function runTask(taskName) {
            logMessage(`[Task] Executing: ${taskName}...`);
            setTimeout(() => {
                logMessage(`[Success] Automation tasks running on active session.`);
            }, 1200);
        }

        function logMessage(text) {
            const consoleBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `<div class="console-line">[${time}] ${text}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
