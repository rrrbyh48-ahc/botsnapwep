<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Automation Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn-action {
            width: 100%;
            background-color: #fffc00;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 12px rgba(255, 252, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Snapplss Automation</h1>
    </div>

    <div class="card">
        <p>لتشغيل لوحة التحكم وأدوات الأتمتة بصيغة سطح المكتب الحقيقية بدون قيود، اضغط على الزر أدناه:</p>
        <!-- استخدام رابط مباشر مع استهداف المتصفح -->
        <a href="https://web.snapchat.com/" target="_blank" class="btn-action">فتح سناب شات ويب (Desktop)</a>
    </div>

</body>
</html>
