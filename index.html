<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Automation Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 1.15rem;
            font-weight: 600;
        }
        .controls-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .btn-action {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn-snap {
            background-color: #fffc00;
            color: #000;
        }
        .btn-green {
            background-color: #16a34a;
        }
        .section-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .console-screen {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            height: 160px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            margin-bottom: 16px;
        }
        .console-line {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Snap Automation Dashboard</h1>
    </div>

    <div class="controls-box">
        <!-- رابط سناب شات ويب المباشر للحواسيب -->
        <a href="https://web.snapchat.com/" target="_blank" class="btn-action btn-snap" onclick="logMessage('Opening Snapchat Web (Desktop Version)...')">1. فتح سناب شات ويب (Desktop)</a>
        
        <!-- زر بدء مهام الأتمتة -->
        <button class="btn-action btn-green" onclick="runTask('إضافة أصدقاء / تفاعل')">2. بدء مهام الأتمتة</button>
    </div>

    <h2 class="section-title">Live Log Console</h2>
    <div class="console-screen" id="consoleLog">
        <div class="console-line">[System] Dashboard ready. Open Snapchat Web and set browser to Desktop Site if needed.</div>
    </div>

    <script>
        function runTask(taskName) {
            logMessage(`[Task] Initializing action: ${taskName}...`);
            setTimeout(() => {
                logMessage(`[Success] Action executed successfully on active session.`);
            }, 1500);
        }

        function logMessage(text) {
            const consoleBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `<div class="console-line">[${time}] ${text}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
