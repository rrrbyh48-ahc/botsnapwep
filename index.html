<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Control Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        /* Login Screen Styles */
        .login-container {
            max-width: 320px;
            margin: 80px auto;
            background-color: #1e293b;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            font-size: 1.25rem;
        }
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
        }
        .btn-primary {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary:active {
            background-color: #1d4ed8;
        }

        /* Dashboard Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 1.15rem;
            font-weight: 600;
        }
        .badge {
            background-color: #059669;
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background-color: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .stat-card h3 {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .stat-card .value {
            font-size: 1.3rem;
            font-weight: bold;
        }
        .controls-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn-start {
            flex: 1;
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-stop {
            flex: 1;
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .section-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        /* Browser Live Console Screen */
        .console-screen {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            height: 160px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            margin-bottom: 16px;
        }
        .console-line {
            margin-bottom: 4px;
        }
        .logout-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <h2>Automation Login</h2>
            <div class="input-group">
                <label>Username or Node ID</label>
                <input type="text" id="username" placeholder="Enter ID...">
            </div>
            <div class="input-group">
                <label>Access Key / Token</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="handleLogin()">Login to Dashboard</button>
        </div>
    </div>

    <!-- 2. شاشة لوحة التحكم الرئيسية -->
    <div id="dashboardScreen" class="screen">
        <div class="header">
            <h1>Control Center</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Active Workers</h3>
                <div class="value" id="workersCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Queue Tasks</h3>
                <div class="value">3</div>
            </div>
        </div>

        <div class="controls-box">
            <button class="btn-start" onclick="startAutomation()">Start Tasks</button>
            <button class="btn-stop" onclick="stopAutomation()">Stop Engine</button>
        </div>

        <h2 class="section-title">Browser Execution Console</h2>
        <div class="console-screen" id="consoleLog">
            <div class="console-line">[System] Waiting for execution command...</div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            if(user.trim() !== "") {
                document.getElementById('loginScreen').classList.remove('active');
                document.getElementById('dashboardScreen').classList.add('active');
                logMessage("Connected successfully to local execution node.");
            } else {
                alert("Please enter a valid Username or Node ID");
            }
        }

        function handleLogout() {
            document.getElementById('dashboardScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
        }

        function startAutomation() {
            document.getElementById('workersCount').innerText = "4";
            logMessage("[Engine] Initializing headless browser instance...");
            setTimeout(() => {
                logMessage("[Worker] Navigating to target targets & harvesting payloads...");
            }, 1000);
            setTimeout(() => {
                logMessage("[Success] Task batch processed successfully.");
            }, 2500);
        }

        function stopAutomation() {
            document.getElementById('workersCount').innerText = "0";
            logMessage("[Warning] Automation engine forcefully stopped by user.");
        }

        function logMessage(text) {
            const consoleBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `<div class="console-line">[${time}] ${text}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
