<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <!-- فرض عرض الشاشة كحاسوب مكتبي 1280 بكسل لمنع تفعيل وضع الموبايل -->
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>Snap Automation Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .top-bar {
            background: #1e293b;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            z-index: 10;
        }
        .top-bar h1 {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .btn-reload {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        /* جعل الـ iframe يملأ الشاشة وكأنه متصفح كمبيوتر كامل */
        .web-frame-container {
            flex: 1;
            width: 100%;
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-bar">
            <h1>Snapplss - Desktop View</h1>
            <button class="btn-reload" onclick="reloadSnap()">تحديث الشاشة</button>
        </div>
        
        <div class="web-frame-container">
            <!-- استخدام رابط الويب المباشر داخل اطار موسع -->
            <iframe id="snapFrame" src="https://web.snapchat.com/" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"></iframe>
        </div>
    </div>

    <script>
        function reloadSnap() {
            const frame = document.getElementById('snapFrame');
            frame.src = frame.src;
        }
    </script>
</body>
</html>
