<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Automation Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        /* Login Screen Styles */
        .login-container {
            max-width: 320px;
            margin: 80px auto;
            background-color: #1e293b;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            font-size: 1.25rem;
        }
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
        }
        .btn-primary {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Dashboard Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 1.15rem;
            font-weight: 600;
        }
        .controls-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn-action {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn-snap {
            background-color: #fffc00;
            color: #000;
        }
        .section-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .console-screen {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            margin-bottom: 16px;
        }
        .console-line {
            margin-bottom: 4px;
        }
        .logout-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <h2>Snap Automation Login</h2>
            <div class="input-group">
                <label>Node ID</label>
                <input type="text" id="username" placeholder="Enter ID...">
            </div>
            <div class="input-group">
                <label>Access Key</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="handleLogin()">Login</button>
        </div>
    </div>

    <!-- 2. لوحة التحكم -->
    <div id="dashboardScreen" class="screen">
        <div class="header">
            <h1>Control Panel</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="controls-box">
            <!-- فتح سناب شات ويب كـ رابط مباشر يتكفل به الـ WebView للتطبيق -->
            <a href="https://web.snapchat.com" target="_self" class="btn-action btn-snap" onclick="logMessage('Opening Snapchat Web session...')">فتح سناب شات ويب (تسجيل الدخول)</a>
            <button class="btn-action" style="background-color: #16a34a;" onclick="runTask('إضافة أصدقاء / متابعة')">بدء مهام الأتمتة</button>
        </div>

        <h2 class="section-title" style="margin-top: 14px;">Live Log Console</h2>
        <div class="console-screen" id="consoleLog">
            <div class="console-line">[System] Ready for operations.</div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            if(user.trim() !== "") {
                document.getElementById('loginScreen').classList.remove('active');
                document.getElementById('dashboardScreen').classList.add('active');
                logMessage("Logged in successfully.");
            } else {
                alert("Please enter Node ID");
            }
        }

        function handleLogout() {
            document.getElementById('dashboardScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
        }

        function runTask(taskName) {
            logMessage(`[Task] Initializing action: ${taskName}...`);
            setTimeout(() => {
                logMessage(`[Success] Action executed on active web session.`);
            }, 1500);
        }

        function logMessage(text) {
            const consoleBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `<div class="console-line">[${time}] ${text}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
